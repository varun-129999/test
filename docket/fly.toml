# Example Fly.io config. Run `fly launch --no-deploy` to pick your own app name, then:
#   fly volumes create docket_data --size 1
#   fly secrets set DOCKET_TOKEN=$(openssl rand -hex 32)
#   fly deploy
app = "docket-example"
primary_region = "bom"

[build]

[env]
  TZ = "Asia/Kolkata"
  DOCKET_REQUIRE_DISK = "1"

[mounts]
  source = "docket_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
